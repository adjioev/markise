[package]
name = "markise-web-render"
description = "PROTOTYPE (proto/block-snapshots): helper process that renders HTML blocks to PNG with the system WebKit (macOS only)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde_json.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
libc.workspace = true
block2 = "0.6.2"
dispatch2 = "0.3.1"
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGImage"] }
objc2-foundation = { version = "0.3.2", features = ["NSString", "NSData", "NSDictionary", "NSError", "NSGeometry", "NSProcessInfo", "NSValue", "NSObject", "NSURL", "NSDate", "NSRunLoop", "NSThread", "NSArray", "NSKeyValueCoding"] }
objc2-app-kit = { version = "0.3.2", features = ["NSApplication", "NSWindow", "NSView", "NSResponder", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphics", "NSRunningApplication", "NSScreen", "NSColor", "NSMenu", "NSMenuItem", "NSEvent", "libc", "objc2-core-graphics"] }
objc2-web-kit = { version = "0.3.2", features = ["WKWebView", "WKWebViewConfiguration", "WKSnapshotConfiguration", "WKContentWorld", "WKFrameInfo", "WKNavigation", "WKPreferences", "WKUserContentController", "WKScriptMessage", "WKScriptMessageHandler", "objc2-app-kit", "block2"] }
