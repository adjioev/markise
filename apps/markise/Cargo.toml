[package]
name = "markise"
description = "Markise desktop app (eframe)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

build = "build.rs"

[[bin]]
name = "markise"
path = "src/main.rs"

[dependencies]
markise-ui-egui.workspace = true
markise-theme.workspace = true
eframe.workspace = true
# renderer start-up errors into the diagnostics log (already in the tree through eframe/wgpu)
log = "0.4"
# update check (src/update_client.rs, issue #70)
markise-engine.workspace = true
ureq.workspace = true
rustls.workspace = true

# Feature unification only (see the workspace manifest): not used from code.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
winit.workspace = true
# clipboard file list (pasting a file manager copy, issue #51)
arboard.workspace = true

# thread CPU time in the frame log (MARKISE_FRAME_LOG)
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

# Native menu bar (macOS, Windows); Linux uses the egui menu bar.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
muda.workspace = true

[build-dependencies]
embed-resource.workspace = true

[dev-dependencies]
memory-stats.workspace = true
