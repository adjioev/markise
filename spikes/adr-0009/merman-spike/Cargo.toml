# THROWAWAY SPIKE for docs/adr/0009-diagrams.md — not a workspace member, not wired into the app.
[package]
name = "spike-merman"
version = "0.0.0"
publish = false
edition = "2024"

[workspace]

[dependencies]
merman = { version = "=0.9.2", default-features = false, features = ["svg", "diagram-flowchart", "diagram-sequence", "diagram-class", "diagram-state", "diagram-er", "diagram-pie", "diagram-gantt"] }

serde_json = "1"

[profile.release]
debug = false
