# Reused by CI and release; no artifacts or write permissions.
name: Heavy tests
on:
  workflow_call:
    inputs:
      sha:
        type: string
        required: true
permissions:
  contents: read
jobs:
  heavy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
      - name: Install Linux system packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libwayland-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libx11-dev libgl1-mesa-dev libegl1-mesa-dev
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: test
      - name: Cache test inputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .spec-cache
            .theme-cache
          key: test-inputs-${{ hashFiles('scripts/fetch-spec-tests.sh', 'scripts/fetch-theme-corpus.sh', 'crates/markise-theme/tests/theme-corpus.tsv') }}
      - name: Fetch spec examples and theme corpus
        run: |
          if [ ! -f .spec-cache/commonmark-0.31.2.json ] || [ ! -f .spec-cache/gfm-spec.txt ]; then
            ./scripts/fetch-spec-tests.sh
          fi
          ./scripts/fetch-theme-corpus.sh
      - name: Heavy tests and stress properties
        run: cargo xtask heavy
