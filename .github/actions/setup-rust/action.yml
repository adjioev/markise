name: Set up Rust
description: >
  Install the toolchain pinned in rust-toolchain.toml (single source of truth: bumping Rust is a
  one-line change there) and restore the Cargo cache.
inputs:
  targets:
    description: Extra compilation targets (comma-separated)
    required: false
    default: ""
  components:
    description: Extra components (comma-separated)
    required: false
    default: ""
  cache-key:
    description: Extra key for the Cargo cache (e.g. the job name)
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Read toolchain channel from rust-toolchain.toml
      id: toolchain
      shell: bash
      run: |
        channel="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)"
        if [ -z "$channel" ]; then echo "no channel in rust-toolchain.toml" >&2; exit 1; fi
        echo "channel=$channel" >> "$GITHUB_OUTPUT"
        echo "Rust toolchain: $channel"
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-10)
      with:
        toolchain: ${{ steps.toolchain.outputs.channel }}
        targets: ${{ inputs.targets }}
        components: ${{ inputs.components }}
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        key: ${{ inputs.cache-key }}
        # Only main writes the cache; PRs restore it (keeps the 10 GB repo cache from churning).
        save-if: ${{ github.ref == 'refs/heads/main' }}
