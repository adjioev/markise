[package]
name = "markise-export"
description = "Markise L3: HTML export (spec 03 DOM contract), export model, theme CSS, Pandoc bridge, export variables"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
markise-md.workspace = true
markise-doc.workspace = true
memchr.workspace = true
markise-blocks.workspace = true
markise-theme.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

# Job objects: kill an export command's whole process tree on cancel/timeout (process.rs).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_Security"] }

[dev-dependencies]
proptest.workspace = true
similar.workspace = true
markise-corpus.workspace = true
criterion.workspace = true

[[bench]]
name = "toc"
harness = false
