[package]
name = "markise-ui-egui"
description = "Markise L6: egui front end — document viewer, sidebar (file tree, outline), source mode"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

build = "build.rs"

[dependencies]
markise-doc.workspace = true
markise-md.workspace = true
ahash.workspace = true
markise-theme.workspace = true
markise-layout.workspace = true
markise-text.workspace = true
markise-blocks.workspace = true
markise-engine.workspace = true
markise-export.workspace = true
egui.workspace = true
rfd.workspace = true
ttf-parser.workspace = true
memmap2.workspace = true
skrifa.workspace = true
vello_cpu.workspace = true
memory-stats.workspace = true
# PROTOTYPE block snapshots (block_snap.rs)
png.workspace = true
serde_json.workspace = true
html-escape.workspace = true
similar.workspace = true

# PROTOTYPE block edit panel (form_panel.rs): one in-process WKWebView, macOS only
[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
block2 = "0.6.2"
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGImage"] }
objc2-foundation = { version = "0.3.2", features = ["NSString", "NSData", "NSDictionary", "NSError", "NSGeometry", "NSObject", "NSArray", "NSURL"] }
objc2-app-kit = { version = "0.3.2", features = ["NSApplication", "NSWindow", "NSView", "NSResponder", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphics", "objc2-core-graphics"] }
objc2-web-kit = { version = "0.3.2", features = ["WKWebView", "WKWebViewConfiguration", "WKSnapshotConfiguration", "WKNavigation", "WKUserContentController", "WKScriptMessage", "WKScriptMessageHandler", "objc2-app-kit", "block2"] }

# Windows: task dialogs with labelled buttons and a Cancel default (issue #40); needs the
# common-controls 6 manifest in every executable (build.rs, apps/markise/build.rs).
[target.'cfg(windows)'.dependencies]
rfd = { workspace = true, features = ["common-controls-v6"] }

[build-dependencies]
embed-resource.workspace = true

[dev-dependencies]
libc.workspace = true
# settings file assertions (tests/it/updates.rs)
serde_json.workspace = true
markise-theme.workspace = true
egui_kittest.workspace = true
markise-corpus.workspace = true
image.workspace = true
tempfile.workspace = true

[[bench]]
name = "viewer"
harness = false

[[bench]]
name = "source_editor"
harness = false

[[bench]]
name = "huge"
harness = false

[[bench]]
name = "save_huge"
harness = false

[[bench]]
name = "memory"
harness = false

[[bench]]
name = "lazy"
harness = false
