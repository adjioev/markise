[package]
name = "markise-pdf"
description = "Markise L3: paginated layout of the export model, PDF (Krilla) and PNG (vello_cpu) output"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
markise-export.workspace = true
markise-md.workspace = true
markise-doc.workspace = true
markise-text.workspace = true
markise-theme.workspace = true
krilla = { version = "0.8.2", default-features = false, features = ["raster-images"] }
vello_cpu = { version = "0.3.0", default-features = false, features = ["std", "png", "text", "u8_pipeline"] }
image.workspace = true
skrifa.workspace = true

[dev-dependencies]
lopdf = "0.46"
tempfile.workspace = true
markise-md.workspace = true
criterion.workspace = true

[target.'cfg(unix)'.dev-dependencies]
libc.workspace = true

[[bench]]
name = "export"
harness = false
